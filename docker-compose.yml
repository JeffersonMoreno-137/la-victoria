services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: la_victoria_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_local}
      POSTGRES_DB: ${POSTGRES_DB:-lavictoriadb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lavictoriadb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
